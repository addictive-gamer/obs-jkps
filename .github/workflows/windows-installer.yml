name: Windows Installer

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer 🪟📦
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Read plugin metadata 🔎
        id: meta
        run: |
          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          "pluginName=$($BuildSpec.name)" >> $env:GITHUB_OUTPUT
          "pluginVersion=$($BuildSpec.version)" >> $env:GITHUB_OUTPUT

      # Reuses the plugin template's own build action: configures with the
      # windows-x64 CMake preset, builds RelWithDebInfo and installs the
      # result into release/RelWithDebInfo/<plugin-name>/...
      - name: Build plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: RelWithDebInfo

      - name: Install Inno Setup 🛠️
        run: choco install innosetup --no-progress -y

      - name: Build installer 📦
        env:
          OBS_JKPS_VERSION: ${{ steps.meta.outputs.pluginVersion }}
          OBS_JKPS_RELEASE_DIR: ${{ github.workspace }}\release\RelWithDebInfo\${{ steps.meta.outputs.pluginName }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\windows\obs-jkps-setup.iss"

      - name: Upload installer artifact 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.pluginName }}-${{ steps.meta.outputs.pluginVersion }}-Windows-Setup
          path: release/installer/*.exe

      - name: Attach installer to release 🚀
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/installer/*.exe
          generate_release_notes: true
