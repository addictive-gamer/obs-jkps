JkpsSource.CustomSkinsEnabledDesc="Loads real noteskin packs (PNG + XML atlas, the format Psych Engine and most FNF engines use) instead of the procedural color themes above. Locks the layout to 4K, since noteskins are always 4 lanes."
JkpsSource.NoteskinsInfoLabel="How Funkin' Skins work"
JkpsSource.NoteskinsInfo="Each pack is one .xml + one .png with the SAME name (e.g. NoteSkin.xml + NoteSkin.png), the Sparrow/TexturePacker atlas format Psych Engine and most FNF engines export. Frame names inside the XML must contain a direction (left/down/up/right) and, optionally, a state (press/confirm - static/idle is the default with no suffix). Point the folder field at either: the pack's own folder directly, OR a root folder holding several packs, each in its own subfolder - both are read at once, so either layout works. obs-jkps ships with zero packs; add your own."
