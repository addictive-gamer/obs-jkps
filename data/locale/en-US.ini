JkpsSource.FunkinRecolor="Recolor arrows to key colors"
JkpsSource.FunkinRecolorDesc="Tints each lane's arrow (and hold bar) using that key's own Idle/Pressed color below. Only packs drawn in white/grayscale for this purpose will actually change color - a pack that's already pre-colored per lane just gets multiplied by its own color, which looks close to unchanged with the default near-white colors."
