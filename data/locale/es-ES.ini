JkpsSource.CustomSkinsEnabledDesc="Carga packs de noteskin reales (atlas PNG + XML, el formato que usa Psych Engine y la mayoría de motores de FNF) en vez de los temas de color procedurales de arriba. Bloquea el diseño a 4K, ya que los noteskins siempre son de 4 carriles."
JkpsSource.NoteskinsInfoLabel="Cómo funcionan las Funkin' Skins"
JkpsSource.NoteskinsInfo="Cada pack es un .xml + un .png con el MISMO nombre (ej. NoteSkin.xml + NoteSkin.png), el formato de atlas Sparrow/TexturePacker que exporta Psych Engine y la mayoría de motores de FNF. Los nombres de los frames dentro del XML deben incluir una dirección (left/down/up/right) y, opcionalmente, un estado (press/confirm - static/reposo es el valor por defecto sin sufijo). Apunta el campo de carpeta a: la carpeta del pack directamente, O una carpeta raíz con varios packs, cada uno en su propia subcarpeta - se leen ambas cosas a la vez, así que cualquiera de las dos formas funciona. obs-jkps no trae ningún pack incluido; agrega los tuyos."
